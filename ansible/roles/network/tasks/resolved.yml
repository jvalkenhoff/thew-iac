---
- name: Ensure systemd-resolved configuration directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy systemd-resolved DNS config
  ansible.builtin.template:
    src: 10-dns.conf.j2
    dest: /etc/systemd/resolved.conf.d/10-dns.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
