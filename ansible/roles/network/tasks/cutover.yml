---
- name: Check prepared network interface configuration
  ansible.builtin.stat:
    path: "/etc/systemd/network/10-{{ network_interface }}.network"
  register: network_interface_file

- name: Check prepared DNS resolver configuration
  ansible.builtin.stat:
    path: /etc/systemd/resolved.conf.d/10-dns.conf
  register: network_dns_file

- name: Require prepared network configuration
  ansible.builtin.assert:
    that:
      - network_interface_file.stat.exists
      - network_dns_file.stat.exists
      - network_interface == ansible_facts.default_ipv4.interface
      - network_address.split('/')[0] == ansible_facts.default_ipv4.address
      - network_gateway == ansible_facts.default_ipv4.gateway
    fail_msg: "Network preparation is incomplete or does not match the host"

- name: Install systemd-resolved
  ansible.builtin.apt:
    name: systemd-resolved
    state: present
  notify: Restart systemd-resolved after installation

- name: Enable and start DNS resolver
  ansible.builtin.systemd_service:
    name: systemd-resolved.service
    enabled: true
    state: started

- name: Configure local DNS stub resolver
  ansible.builtin.file:
    path: /etc/resolv.conf
    src: /run/systemd/resolve/stub-resolv.conf
    state: link
    force: true

- name: Apply pending handlers before DNS verification
  ansible.builtin.meta: flush_handlers

- name: Verify DNS resolution before network cutover
  ansible.builtin.command:
    cmd: resolvectl query deb.debian.org
  changed_when: false

- name: Disable legacy networking on future boots
  ansible.builtin.systemd_service:
    name: networking.service
    enabled: false

- name: Enable systemd-networkd on future boots
  ansible.builtin.systemd_service:
    name: systemd-networkd.service
    enabled: true

- name: Disable legacy ifupdown interface definitions
  ansible.builtin.replace:
    path: /etc/network/interfaces
    regexp: '^(?!\s*#|\s*$)(.+)$'
    replace: '# \1'
    backup: true

- name: Gather network service state before cutover
  ansible.builtin.service_facts:

- name: Reboot to activate systemd-networkd
  ansible.builtin.reboot:
    reboot_timeout: 300
    post_reboot_delay: 10
  when: network_cutover_required

- name: Refresh network facts after cutover
  ansible.builtin.setup:
    gather_subset:
      - network

- name: Gather service states after network cutover
  ansible.builtin.service_facts:

- name: Determine whether network cutover requires a reboot
  ansible.builtin.set_fact:
    network_cutover_required: >-
      {{
        ansible_facts.services.get('systemd-networkd.service', {}).get('state') != 'running'
        or
        ansible_facts.services.get('networking.service', {}).get('status') == 'enabled'
      }}

- name: Verify systemd-networkd is running
  ansible.builtin.assert:
    that:
      - ansible_facts.services.get('systemd-networkd.service', {}).get('state') == 'running'
    fail_msg: "systemd-networkd is not running after reboot"

- name: Verify network addressing after cutover
  ansible.builtin.assert:
    that:
      - network_interface == ansible_facts.default_ipv4.interface
      - network_address.split('/')[0] == ansible_facts.default_ipv4.address
      - network_gateway == ansible_facts.default_ipv4.gateway

- name: Inspect active networkd interface configuration
  ansible.builtin.command:
    cmd: "networkctl status {{ network_interface }} --no-pager"
  register: network_active_interface
  changed_when: false

- name: Verify networkd manages the expected interface
  ansible.builtin.assert:
    that:
      - >-
        ('10' ~ network_interface ~ '.network')
        in network_active_interface.stdout
    fail_msg: "Network interface is not using the expected networkd configuration."

- name: Verify DNS resolution after cutover
  ansible.builtin.command:
    cmd: resolvectl query deb.debian.org
  changed_when: false
