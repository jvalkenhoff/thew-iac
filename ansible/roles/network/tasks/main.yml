---
- name: Verify network interface
  ansible.builtin.assert:
    that:
      - network_interface == ansible_facts.default_ipv4.interface
      - network_address.split('/')[0] == ansible_facts.default_ipv4.address
      - network_gateway == ansible_facts.default_ipv4.gateway
    fail_msg: "Desired network configuration does not match the current connection."

- name: Gather network service information
  ansible.builtin.service_facts:

- name: Ensure networkd is not managing the network yet
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts.services.get('systemd-networkd.service', {}).get('state', 'stopped') != 'running'
    msg: "systemd-networkd is already running. Review the current network config before proceeding."

- name: Ensure networkd configuration directory exists
  ansible.builtin.file:
    path: /etc/systemd/network
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy static network interface config
  ansible.builtin.template:
    src: 10-interface.network.j2
    dest: "/etc/systemd/network/10-{{ network_interface }}.network"
    owner: root
    group: root
    mode: '0644'
    backup: true

- name: Prepare DNS resolver configuration
  ansible.builtin.import_tasks: resolved.yml
