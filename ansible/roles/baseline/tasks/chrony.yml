---
- name: Gather service information
  ansible.builtin.service_facts:

- name: Disable systemd-timesyncd if installed
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    state: stopped
    enabled: false
    masked: true
  when: "'systemd-timesyncd.service' in ansible_facts.packages"

- name: Configure Chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Chrony

- name: Ensure Chrony is running
  ansible.builtin.systemd_service:
    name: chrony.service
    enabled: true
    masked: false
    state: started
  when: not ansible_check_mode or 'chrony.service' in ansible_facts.services
