---
- name: Inspect block devices and filesystems
  ansible.builtin.command:
    cmd: lsblk -o NAME,PATH,TYPE,FSTYPE,UUID,MOUNTPOINTS
  register: baseline_block_devices
  changed_when: false
  check_mode: false

- name: Display block device layout
  ansible.builtin.debug:
    msg: "{{ baseline_block_devices.stdout_lines }}"

- name: Remove obsolete Debian installer CD-ROM mount
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*/dev/sr0\s+/media/cdrom0\s+'
    state: absent
    backup: true
  notify: Reload systemctl daemon

- name: Read existing filesystem table
  ansible.builtin.slurp:
    src: /etc/fstab
  register: baseline_fstab

- name: Display existing filesystem table
  ansible.builtin.debug:
    msg: "{{ baseline_fstab.content | b64decode }}"

- name: Apply pending filesystem configuration changes
  ansible.builtin.meta: flush_handlers

- name: Verify existing filesystem table
  ansible.builtin.command:
    cmd: findmnt --verify --verbose
  register: baseline_fstab_verification
  changed_when: false
  check_mode: false

- name: Display filesystem verification results
  ansible.builtin.debug:
    msg: "{{ baseline_fstab_verification.stdout_lines }}"
