---
- name: Configure baseline packages
  ansible.builtin.import_tasks: packages.yml

- name: Remove unwanted packages
  ansible.builtin.import_tasks: package_cleanup.yml

- name: Configure APT repositories
  ansible.builtin.import_tasks: repositories.yml

- name: Configure administrative user
  ansible.builtin.import_tasks: admin.yml

