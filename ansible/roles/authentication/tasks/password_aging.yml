---
- name: Ensure managed accounts already exist
  ansible.builtin.getent:
    database: passwd
    key: "{{ item }}"
    fail_key: true
  loop:
    - root
    - debian

- name: Configure password aging for existing accounts
  ansible.builtin.user:
    name: "{{ item }}"
    state: present
    password_expire_max: 365
    password_expire_min: 1
    # password_expire_warn: 7
    # password_expire_account_disable: 45
  loop:
    - root
    - debian
