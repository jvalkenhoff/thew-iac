---
- name: Configure Debian baseline
  hosts: lab
  become: true

  tasks:
    - name: Install baseline packages
      ansible.builtin.apt:
        name:
          - bash-completion
          - apt-transport-https
          - ca-certificates
          - chrony
          - cron
          - curl
          - debian-archive-keyring
          - gpg
          - sudo
          - vim
          - wget
          - jq
          - tcpdump
          - open-vm-tools
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable vmware tools
      ansible.builtin.systemd_service:
        name: open-vm-tools
        enabled: true
        state: started
