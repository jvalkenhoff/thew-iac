---
- name: Configure Chrony (timesync)
  hosts: lab
  become: true

  handlers:
    - name: Restart Chrony
      ansible.builtin.systemd_service:
        name: chrony.service
        state: restarted

  tasks:
    - name: Install Chrony
      ansible.builtin.apt:
        name: chrony
        state: present

    - name: Service Info
      ansible.builtin.service_facts:

    - name: Disable timesyncd if installed
      ansible.builtin.systemd_service:
        name: systemd-timesyncd.service
        state: stopped
        enabled: false
        masked: true
      when: "'systemd-timesyncd.service' in ansible_facts.services"

    - name: Configure Chrony
      ansible.builtin.copy:
        dest: /etc/chrony/chrony.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          pool nl.pool.ntp.org iburst maxsources 4
          driftfile /var/lib/chrony/chrony.drift
          makestep 1.0 3
          rtcsync
          port 0
          cmdport 0
          logdir /var/log/chrony
      notify: Restart Chrony

    - name: Check if chrony runs
      ansible.builtin.systemd_service:
        name: chrony.service
        enabled: true
        masked: false
        state: started
